# Pointer file. The checks are in .icm/_system/ci/check.sh.
name: icm
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  icm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .icm/_system/ci/check.sh
  icm-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .icm/_system/ci/check.sh --gate
